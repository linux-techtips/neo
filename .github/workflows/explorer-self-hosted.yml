on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2

      - name: Change directory to neo_explorer
        run: cd neo_explorer

      - name: Run Zig Build
        run: zig build -Doptimize=ReleaseFast
        working-directory: neo_explorer

      - name: Start the Server
        run: ./zig-out/bin/neo_explorer --port=6969 --addr=0.0.0.0 &

      - name: Confirm Server is Running
        run: |
          echo "Waiting for the server to start..."
          sleep 10
          curl -f http://localhost:6969 || { echo "Server failed to start"; exit 1; }
